<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartas</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Georgia, serif;
}

body {
  min-height: 100vh;
  background: url("carta.png") center/cover no-repeat;
  display: flex;
  justify-content: center;
  padding: 40px 15px;
}

/* Container principal */
.container {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.92);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  text-align: center;
}

/* Foto usuário */
.profile-pic {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #8b6f4e;
  margin-bottom: 10px;
}

/* Título */
h2 {
  color: #4a3a28;
  margin-bottom: 20px;
}

/* Lista de cartas */
.cartas-container {
  max-height: 320px;
  overflow-y: auto;
  padding-right: 5px;
}

/* Carta item */
.carta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(139,111,78,0.08);
  border: 1px solid #8b6f4e;
  border-radius: 12px;
  padding: 12px 15px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.carta:hover {
  background: rgba(139,111,78,0.2);
  transform: scale(1.03);
}

.check {
  font-size: 18px;
  color: #bbb;
}

.check.lida {
  color: #8b6f4e;
}

/* Modal da carta */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: #fffdf8;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;            /* limite de altura */
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  text-align: left;
  display: flex;
  flex-direction: column;
}

.modal-content h3 {
  margin-bottom: 15px;
  color: #4a3a28;
}

.modal-content p {
  line-height: 1.6;
  color: #3a2f23;
  white-space: pre-line;
  overflow-y: auto;        /* rolagem vertical */
  flex: 1;                 /* ocupa o espaço disponível */
  padding-right: 5px;
}

.fechar {
  margin-top: 20px;
  text-align: right;
}

.fechar button {
  background: #8b6f4e;
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
}

/* Botão voltar */
.voltar {
  position: fixed;
  top: 20px;
  left: 20px;
}

.voltar a {
  text-decoration: none;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="voltar">
  <a href="home.html">← voltar</a>
</div>

<div class="container">
  <img src="perfil.jpg" class="profile-pic" alt="Perfil">

  <div class="cartas-container" id="cartas"></div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitulo"></h3>
    <p id="modalTexto"></p>
    <div class="fechar">
      <button onclick="fecharCarta()">Fechar</button>
    </div>
  </div>
</div>
